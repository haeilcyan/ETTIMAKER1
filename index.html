<body data-t="sketch">
<div id="brand">ETTIMAKER</div>
<header>
  <input type="text" id="ttl" placeholder="관계도 제목" aria-label="관계도 제목" maxlength="40">
  <select id="fnt" aria-label="글꼴"><option value="">글꼴 · 기본</option><option value="gowun" style="font-family:'Gowun Dodum'">고운돋움</option><option value="myeong" style="font-family:'Nanum Myeongjo'">나눔명조</option><option value="pen" style="font-family:'Nanum Pen Script'">나눔손글씨 펜</option><option value="black" style="font-family:'Black Han Sans'">블랙한산스</option><option value="noto" style="font-family:'Noto Sans KR'">노토산스</option></select><label class="fzl" title="글씨 크기"><span>가</span><input type="range" id="fsz" min="12" max="34" step="1" aria-label="글씨 크기"></label>

    <button id="conn">관계 잇기</button>
    <button id="grp">그룹</button>
    <button id="ls" title="관계 라벨 스타일 전환">라벨 · 네모칸</button>
    <details id="more"><summary aria-label="더보기">⋯</summary><div class="mn"><button id="png">PNG 이미지 저장</button><button id="exp">JSON 저장</button><button id="imp">불러오기</button><button id="new">새로 만들기</button></div></details>
  </div>
  <input type="file" id="file" accept=".json,application/json" hidden>
</header>
<svg id="cv" role="img" aria-label="관계도 캔버스">
  <defs>
    <linearGradient id="gl-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset=".5" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity=".5"/></linearGradient><linearGradient id="gl-s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><linearGradient id="sv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6f9ff"/><stop offset=".3" stop-color="#8f9cc0"/><stop offset=".55" stop-color="#eef3ff"/><stop offset=".8" stop-color="#6d7aa0"/><stop offset="1" stop-color="#f6f9ff"/></linearGradient><linearGradient id="pg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset=".5" stop-color="#d946ef"/><stop offset="1" stop-color="#ff4fa3"/></linearGradient><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/></linearGradient><linearGradient id="cg-s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#d6efff"/></linearGradient><linearGradient id="cg-t" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#c9d2ff"/></linearGradient><linearGradient id="cg-a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#e2d0ff"/></linearGradient><linearGradient id="holo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#9fb4ff"/><stop offset=".6" stop-color="#e6fff7"/><stop offset="1" stop-color="#b9a7ff"/></linearGradient><linearGradient id="holo2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7ad9"/><stop offset=".3" stop-color="#7ae7ff"/><stop offset=".55" stop-color="#d4ff7a"/><stop offset=".8" stop-color="#b48cff"/><stop offset="1" stop-color="#ff7ad9"/></linearGradient><clipPath id="cp-sketch" clipPathUnits="objectBoundingBox"><circle cx=".5" cy=".5" r=".5"/></clipPath><clipPath id="cp-summer" clipPathUnits="objectBoundingBox"><circle cx=".5" cy=".5" r=".5"/></clipPath><clipPath id="cp-themis" clipPathUnits="objectBoundingBox"><polygon points=".5,0 .97,.25 .97,.75 .5,1 .03,.75 .03,.25"/></clipPath><clipPath id="cp-apsu" clipPathUnits="objectBoundingBox"><rect width="1" height="1" rx=".15" ry=".15"/></clipPath>
    <filter id="pencil" filterUnits="userSpaceOnUse" x="-5000" y="-5000" width="10000" height="10000"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="4"/></filter>

  <g id="gg"></g><g id="eg"></g><g id="hg"></g><g id="lg"></g><g id="ng"></g>
</svg>
<div class="zm"><button id="zi" aria-label="확대">+</button><button id="zo" aria-label="축소">−</button></div>
<div id="hint" hidden></div>
<aside id="panel" hidden></aside>

<script>
const $=s=>document.querySelector(s), KEY='relmap-v1', R=42;
const THEMES=[['sketch','스케치북'],['summer','여름청춘'],['themis','THEMIS'],['apsu','APSU'],['ops','군부·서바이벌']];
const PRESETS=['기본','우호','적대','연애','가족','미묘'];
const FS={sketch:24,summer:21,themis:15,apsu:22};
const lw=s=>[...s].reduce((t,c)=>t+(c>'~'?1:.6),0)*FS[S.theme];
const shp=r=>{const t='';if(t==='themis')return'M'+[0,1,2,3,4,5].map(i=>(r*1.1*Math.cos(i*Math.PI/3+Math.PI/6)).toFixed(1)+' '+(r*1.1*Math.sin(i*Math.PI/3+Math.PI/6)).toFixed(1)).join('L')+'Z';if(t==='apsu'){const k=r*.28;return`M${-r+k} ${-r}H${r-k}Q${r} ${-r} ${r} ${-r+k}V${r-k}Q${r} ${r} ${r-k} ${r}H${-r+k}Q${-r} ${r} ${-r} ${r-k}V${-r+k}Q${-r} ${-r} ${-r+k} ${-r}Z`}return`M${-r} 0a${r} ${r} 0 1 0 ${2*r} 0a${r} ${r} 0 1 0 ${-2*r} 0`};
const uid=()=>Date.now()*1000+Math.floor(Math.random()*1000);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const svg=$('#cv'), P=$('#panel');
let S=load()||sample(), sel=null, mode=null, from=null, drag=null, vb={x:0,y:0,w:1000,h:700};

function sample(){return{title:'우리 관계도',theme:'sketch',
 nodes:[{id:1,name:'하린',img:'',x:300,y:300},{id:2,name:'시우',img:'',x:650,y:230},{id:3,name:'도현',img:'',x:520,y:480}],
 edges:[{id:4,a:1,b:2,label:'소꿉친구',c:1},{id:5,a:2,b:3,label:'라이벌',c:2},{id:6,a:3,b:1,label:'짝사랑',c:3}]}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));return d&&Array.isArray(d.nodes)?d:null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){hint('저장 공간이 부족해요. 저장 버튼으로 파일을 내려받으세요')}}
let ht;function hint(t,keep){const h=$('#hint');h.textContent=t;h.hidden=false;clearTimeout(ht);if(!keep)ht=setTimeout(()=>h.hidden=true,2500)}
const N=id=>S.nodes.find(n=>n.id===id);
const pt=ev=>{const p=svg.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())};
function fit(){vb.h=vb.w*svg.clientHeight/svg.clientWidth}

async function bgImg(cw,ch){
  const cs=getComputedStyle(document.body),b=cs.getPropertyValue('--bg').trim()||'none',p=cs.getPropertyValue('--pat').trim()||'none';
  const x=`<svg xmlns="http://www.w3.org/2000/svg" width="${cw}" height="${ch}"><foreignObject width="${cw}" height="${ch}"><div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:${cw}px;height:${ch}px;background:${esc(b)}"><div style="position:absolute;left:0;top:0;right:0;bottom:0;background:${esc(p)}"></div></div></foreignObject></svg>`;
  return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(x)})}
const ldv=n=>new Promise(r=>{const m=/url\((["']?)(.*?)\1\)/s.exec(getComputedStyle(document.body).getPropertyValue(n));if(!m)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=m[2]});
const ang=(dx,dy)=>{if(S.ls==='classic')return 0;let a=Math.atan2(dy,dx)*180/Math.PI;if(a>90)a-=180;if(a<-90)a+=180;return a.toFixed(1)};
const tc=i=>{let h=getComputedStyle(document.body).getPropertyValue('--c'+i).trim().replace('#','');if(h.length===3)h=[...h].map(c=>c+c).join('');const n=parseInt(h,16);if(h.length!==6||isNaN(n))return'#fff';return(.299*(n>>16)+.587*(n>>8&255)+.114*(n&255))/255>.62?'#111':'#fff'};
function gcirc(o){const m=o.m.map(i=>N(i)).filter(Boolean);if(!m.length)return null;const xs=m.map(n=>n.x),ys=m.map(n=>n.y),cx=(Math.min(...xs)+Math.max(...xs))/2,cy=(Math.min(...ys)+Math.max(...ys))/2;return{cx,cy,r:Math.max(...m.map(n=>Math.hypot(n.x-cx,n.y-cy)))+R+46}}
function groupPanel(){
  const nw=sel.t==='newg',o=nw?{id:0,name:'',m:[],c:3}:(S.groups||[]).find(x=>x.id===sel.id);
  if(!o){sel=null;P.hidden=true;return}
  const sw=PRESETS.map((t,i)=>`<div><button data-c="${i}" style="--c:var(--c${i})" class="${o.c===i?'on':''}" aria-label="${t}"></button><span>${t}</span></div>`).join('');
  P.hidden=false;
  P.innerHTML=`<h3>${nw?'그룹 만들기':'그룹'}</h3><label>그룹 이름 (필수)<input type="text" id="gn" maxlength="16" placeholder="예: 포저 가문" value="${esc(o.name)}"></label><div>묶을 인물<div class="mem">${S.nodes.map(n=>`<label class="ck"><input type="checkbox" value="${n.id}" ${o.m.includes(n.id)?'checked':''}>${esc(n.name)}</label>`).join('')}</div></div><div>색상<div class="sw">${sw}</div></div>`+(nw?'<button class="pri" id="ok" disabled>만들기</button><button id="cx">닫기</button>':'<button id="dl">그룹 삭제 (인물은 유지)</button>');
  const q=s=>P.querySelector(s),chk=()=>[...P.querySelectorAll('.mem input:checked')].map(i=>+i.value);
  const upd=()=>{const nm=q('#gn').value.trim();if(nm)o.name=nm;o.m=chk();if(nw)q('#ok').disabled=!(nm&&o.m.length);else{save();render()}};
  q('#gn').oninput=upd;P.querySelectorAll('.mem input').forEach(i=>i.onchange=upd);
  P.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{o.c=+b.dataset.c;P.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));if(!nw){save();render()}});
  if(nw){q('#ok').onclick=()=>{o.id=uid();(S.groups=S.groups||[]).push(o);sel={t:'g',id:o.id};save();render();panel()};q('#cx').onclick=()=>{sel=null;panel()}}
  else q('#dl').onclick=()=>{S.groups=S.groups.filter(x=>x.id!==o.id);sel=null;save();render();panel()};
}
function duoSegs(g,a,b){
  return[[a,b,g.c,g.label],[b,a,g.c2==null?g.c:g.c2,g.label2]].map(([p,q,c,t])=>{
    const dx=q.x-p.x,dy=q.y-p.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,nx=-uy*20,ny=ux*20,s=R+14,
    x0=p.x+nx+ux*s,y0=p.y+ny+uy*s,x1=q.x+nx-ux*s,y1=q.y+ny-uy*s;
    return{q:[x0,y0,(x0+x1)/2,(y0+y1)/2,x1,y1],arr:[x1,y1,ux,uy],c,t,m:[x0+(x1-x0)*.42,y0+(y1-y0)*.42]}})}
function render(){
  document.body.dataset.t=S.theme;document.body.dataset.f=S.font||'';$('#fnt').value=S.font||'';document.body.style.setProperty('--fs',S.fs?S.fs+'px':'');document.body.dataset.ls=S.ls||'';$('#ls').textContent=S.ls==='classic'?'라벨 · 원래':'라벨 · 네모칸';$('#fsz').value=S.fs||parseFloat(getComputedStyle(document.body).getPropertyValue('--fs'))||19;
  svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  let e='',h='',l='',n='';
  for(const g of S.edges){const a=N(g.a),b=N(g.b);if(!a||!b)continue;
    if(g.type==='duo'){const on=sel&&sel.t==='e'&&sel.id===g.id;
      for(const s of duoSegs(g,a,b)){const [x0,y0,,,x1,y1]=s.q,[ax,ay,ux,uy]=s.arr,d=`M${x0} ${y0}L${x1-ux*12} ${y1-uy*12}`,st=`style="stroke:var(--c${s.c});fill:var(--c${s.c});color:var(--c${s.c})"`;
        e+=`<path class="edge${on?' on':''}" d="${d}" ${st}/><polygon class="ah" points="${ax},${ay} ${ax-ux*16-uy*8},${ay-uy*16+ux*8} ${ax-ux*16+uy*8},${ay-uy*16-ux*8}" ${st}/>`;
        h+=`<path class="hit" data-e="${g.id}" d="${d}"/>`;
        if(s.t){const w=lw(s.t)+24;l+=`<g class="lbg" data-e="${g.id}" style="--cc:var(--c${s.c});--tc:${tc(s.c)}" transform="translate(${s.m[0]} ${s.m[1]}) rotate(${ang(x1-x0,y1-y0)})"><rect class="chip" x="${-w/2}" y="-15" width="${w}" height="30"/><text class="lb" y="7">${esc(s.t)}</text></g>`}}
      continue}
    const on=sel&&sel.t==='e'&&sel.id===g.id,c=`style="stroke:var(--c${g.c});color:var(--c${g.c})"`,
    cx=(a.x+b.x)/2-(b.y-a.y)*.08,cy=(a.y+b.y)/2+(b.x-a.x)*.08,d=`M${a.x} ${a.y}Q${cx} ${cy} ${b.x} ${b.y}`,mx=(a.x+b.x+2*cx)/4,my=(a.y+b.y+2*cy)/4;
    e+=`<path class="edge${on?' on':''}" d="${d}" ${c}/>`+(S.theme==='sketch'?`<path class="edge e2" d="M${a.x+3} ${a.y-2}Q${cx-2} ${cy+3} ${b.x-2} ${b.y+3}" ${c}/>`:'');
    h+=`<path class="hit" data-e="${g.id}" d="${d}"/>`;
    if(g.label){const w=lw(g.label)+24;l+=`<g class="lbg" data-e="${g.id}" style="--cc:var(--c${g.c});--tc:${tc(g.c)}" transform="translate(${mx} ${my}) rotate(${ang(b.x-a.x,b.y-a.y)})"><rect class="chip" x="${-w/2}" y="-15" width="${w}" height="30"/><text class="lb" y="7">${esc(g.label)}</text></g>`}}
  for(const d of S.nodes){const on=sel&&sel.t==='n'&&sel.id===d.id;
    n+=`<g class="node${on?' on':''}${from===d.id?' from':''}" data-n="${d.id}" transform="translate(${d.x} ${d.y})"><g class="sh"><path class="ring" d="${shp(R+8)}"/>`+
    (d.img?`<image href="${d.img}" x="${-R}" y="${-R}" width="${2*R}" height="${2*R}" clip-path="url(#cp-sketch)" preserveAspectRatio="xMidYMid slice"/>`:`<path class="ph" d="${shp(R)}"/><text class="ini" y="12">${esc([...d.name][0]||'')}</text>`)+
    `<circle class="gloss" r="${R}"/><ellipse class="spec" cx="${-R*.3}" cy="${-R*.6}" rx="${R*.5}" ry="${R*.19}" transform="rotate(-26 ${-R*.3} ${-R*.6})"/><circle class="rim" r="${R}"/><rect class="tape" x="-22" y="${-R-12}" width="44" height="16" transform="rotate(-8)"/></g><text class="nm" y="${R+36}">${esc(d.name)}</text></g>`}
  if(!S.nodes.length)n+=`<text class="nm" x="${vb.x+vb.w/2}" y="${vb.y+vb.h/2}">위의 + 인물 버튼으로 시작하세요</text>`;
  let gr='';for(const o of S.groups||[]){const z=gcirc(o);if(!z)continue;const on=sel&&sel.t==='g'&&sel.id===o.id,w=lw(o.name)+28;
  gr+=`<g class="grp${on?' on':''}" style="--gc:var(--c${o.c})"><circle class="gfill" cx="${z.cx}" cy="${z.cy}" r="${z.r}"/><circle class="ghit" data-g="${o.id}" cx="${z.cx}" cy="${z.cy}" r="${z.r}"/><g class="gtag" data-g="${o.id}" transform="translate(${z.cx} ${z.cy-z.r})"><rect x="${-w/2}" y="-15" width="${w}" height="30" rx="15"/><text y="6">${esc(o.name)}</text></g></g>`}

    g.font=font(fs+1);g.lineJoin='round';g.lineWidth=5;g.strokeStyle=v('--halo');g.strokeText(d.name,d.x,d.y+R+36);g.fillStyle=v('--ink');g.fillText(d.name,d.x,d.y+R+36)}
  g.textAlign='left';g.fillStyle=v('--ink');g.font=font(fs+7);if(S.title)g.fillText(S.title,x0+34,y0+44);
  g.textAlign='right';g.globalAlpha=.6;g.font="700 12px Orbitron,sans-serif";try{g.letterSpacing='4px'}catch(e){}g.fillText('ETTIMAKER',x0+W-24,y0+H-22);g.globalAlpha=1;
  c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(S.title||'relationship')+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);hint('PNG로 저장했어요')},'image/png');
  }catch(e){hint('이미지 저장에 실패했어요')}
}
$('#png').onclick=savePng;
$('#grp').onclick=()=>{endConn();if(S.nodes.length<2){hint('인물을 2명 이상 추가해 주세요');return}sel={t:'newg'};render();panel()};
$('#imp').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.nodes)||!Array.isArray(d.edges))throw 0;
  S={title:d.title||'',theme:THEMES.some(t=>t[0]===d.theme)?d.theme:'sketch',nodes:d.nodes,edges:d.edges,groups:d.groups||[],font:d.font||'',fs:d.fs||0,ls:d.ls||''};sel=null;save();render();panel()}catch(x){hint('관계도 JSON 파일이 아니에요')}};r.readAsText(f);e.target.value=''};
$('#new').onclick=()=>{if(!confirm('현재 관계도를 지우고 새로 시작할까요? (먼저 저장 버튼으로 내려받아 두세요)'))return;S={title:'',theme:S.theme,nodes:[],edges:[]};sel=null;endConn();save();render();panel()};
addEventListener('resize',()=>{fit();render()});
document.querySelectorAll('#more button').forEach(b=>b.addEventListener('click',()=>$('#more').open=false));
if(innerWidth<700){vb.w=520;fit();if(S.nodes.length){const k=S.nodes.length;vb.x=S.nodes.reduce((s,n)=>s+n.x,0)/k-vb.w/2;vb.y=S.nodes.reduce((s,n)=>s+n.y,0)/k-vb.h/2}}
fit();render();
