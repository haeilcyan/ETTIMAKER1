<body data-t="sketch">
<div id="brand">ETTIMAKER</div>
<header>
  <input type="text" id="ttl" placeholder="관계도 제목" aria-label="관계도 제목" maxlength="40">
  <select id="fnt" aria-label="글꼴"><option value="">글꼴 · 기본</option><option value="gowun" style="font-family:'Gowun Dodum'">고운돋움</option><option value="myeong" style="font-family:'Nanum Myeongjo'">나눔명조</option><option value="pen" style="font-family:'Nanum Pen Script'">나눔손글씨 펜</option><option value="black" style="font-family:'Black Han Sans'">블랙한산스</option><option value="noto" style="font-family:'Noto Sans KR'">노토산스</option></select>
  <div class="grp" id="themes"></div>
  <div class="grp">
    <button id="add" class="pri">+ 인물</button>
    <button id="conn">관계 잇기</button>
    <details id="more"><summary aria-label="더보기">⋯</summary><div class="mn"><button id="png">PNG 이미지 저장</button><button id="exp">JSON 저장</button><button id="imp">불러오기</button><button id="new">새로 만들기</button></div></details>
  </div>
  <input type="file" id="file" accept=".json,application/json" hidden>
</header>
<svg id="cv" role="img" aria-label="관계도 캔버스">
  <defs>
    <linearGradient id="gl-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset=".5" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity=".5"/></linearGradient><linearGradient id="gl-s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/></linearGradient><linearGradient id="cg-s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#d6efff"/></linearGradient><linearGradient id="cg-t" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#c9d2ff"/></linearGradient><linearGradient id="cg-a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#e2d0ff"/></linearGradient><linearGradient id="holo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#9fb4ff"/><stop offset=".6" stop-color="#e6fff7"/><stop offset="1" stop-color="#b9a7ff"/></linearGradient><linearGradient id="holo2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7ad9"/><stop offset=".3" stop-color="#7ae7ff"/><stop offset=".55" stop-color="#d4ff7a"/><stop offset=".8" stop-color="#b48cff"/><stop offset="1" stop-color="#ff7ad9"/></linearGradient><clipPath id="cp-sketch" clipPathUnits="objectBoundingBox"><circle cx=".5" cy=".5" r=".5"/></clipPath><clipPath id="cp-summer" clipPathUnits="objectBoundingBox"><circle cx=".5" cy=".5" r=".5"/></clipPath><clipPath id="cp-themis" clipPathUnits="objectBoundingBox"><polygon points=".5,0 .97,.25 .97,.75 .5,1 .03,.75 .03,.25"/></clipPath><clipPath id="cp-apsu" clipPathUnits="objectBoundingBox"><rect width="1" height="1" rx=".15" ry=".15"/></clipPath>
    <filter id="pencil" filterUnits="userSpaceOnUse" x="-5000" y="-5000" width="10000" height="10000"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="4"/></filter>
  </defs>
  <g id="eg"></g><g id="hg"></g><g id="lg"></g><g id="ng"></g>
</svg>
<div class="zm"><button id="zi" aria-label="확대">+</button><button id="zo" aria-label="축소">−</button></div>
<div id="hint" hidden></div>
<aside id="panel" hidden></aside>

<script>
const $=s=>document.querySelector(s), KEY='relmap-v1', R=42;
const THEMES=[['sketch','스케치북'],['summer','여름청춘'],['themis','THEMIS'],['apsu','APSU']];
const PRESETS=['기본','우호','적대','연애','가족','미묘'];
const FS={sketch:24,summer:21,themis:15,apsu:22};
const lw=s=>[...s].reduce((t,c)=>t+(c>'~'?1:.6),0)*FS[S.theme];
const shp=r=>{const t='';if(t==='themis')return'M'+[0,1,2,3,4,5].map(i=>(r*1.1*Math.cos(i*Math.PI/3+Math.PI/6)).toFixed(1)+' '+(r*1.1*Math.sin(i*Math.PI/3+Math.PI/6)).toFixed(1)).join('L')+'Z';if(t==='apsu'){const k=r*.28;return`M${-r+k} ${-r}H${r-k}Q${r} ${-r} ${r} ${-r+k}V${r-k}Q${r} ${r} ${r-k} ${r}H${-r+k}Q${-r} ${r} ${-r} ${r-k}V${-r+k}Q${-r} ${-r} ${-r+k} ${-r}Z`}return`M${-r} 0a${r} ${r} 0 1 0 ${2*r} 0a${r} ${r} 0 1 0 ${-2*r} 0`};
const uid=()=>Date.now()*1000+Math.floor(Math.random()*1000);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const svg=$('#cv'), P=$('#panel');
let S=load()||sample(), sel=null, mode=null, from=null, drag=null, vb={x:0,y:0,w:1000,h:700};

function sample(){return{title:'우리 관계도',theme:'sketch',
 nodes:[{id:1,name:'하린',img:'',x:300,y:300},{id:2,name:'시우',img:'',x:650,y:230},{id:3,name:'도현',img:'',x:520,y:480}],
 edges:[{id:4,a:1,b:2,label:'소꿉친구',c:1},{id:5,a:2,b:3,label:'라이벌',c:2},{id:6,a:3,b:1,label:'짝사랑',c:3}]}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));return d&&Array.isArray(d.nodes)?d:null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){hint('저장 공간이 부족해요. 저장 버튼으로 파일을 내려받으세요')}}
let ht;function hint(t,keep){const h=$('#hint');h.textContent=t;h.hidden=false;clearTimeout(ht);if(!keep)ht=setTimeout(()=>h.hidden=true,2500)}
const N=id=>S.nodes.find(n=>n.id===id);
const pt=ev=>{const p=svg.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())};
function fit(){vb.h=vb.w*svg.clientHeight/svg.clientWidth}

function duoSegs(g,a,b){
  return[[a,b,g.c,g.label],[b,a,g.c2==null?g.c:g.c2,g.label2]].map(([p,q,c,t])=>{
    const dx=q.x-p.x,dy=q.y-p.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,nx=-uy*20,ny=ux*20,s=R+14,
    x0=p.x+nx+ux*s,y0=p.y+ny+uy*s,x1=q.x+nx-ux*s,y1=q.y+ny-uy*s;
    return{q:[x0,y0,(x0+x1)/2,(y0+y1)/2,x1,y1],arr:[x1,y1,ux,uy],c,t,m:[x0+(x1-x0)*.42,y0+(y1-y0)*.42]}})}
function render(){
  document.body.dataset.t=S.theme;document.body.dataset.f=S.font||'';$('#fnt').value=S.font||'';
  svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  let e='',h='',l='',n='';
  for(const g of S.edges){const a=N(g.a),b=N(g.b);if(!a||!b)continue;
    if(g.type==='duo'){const on=sel&&sel.t==='e'&&sel.id===g.id;
      for(const s of duoSegs(g,a,b)){const [x0,y0,,,x1,y1]=s.q,[ax,ay,ux,uy]=s.arr,d=`M${x0} ${y0}L${x1-ux*12} ${y1-uy*12}`,st=`style="stroke:var(--c${s.c});fill:var(--c${s.c});color:var(--c${s.c})"`;
        e+=`<path class="edge${on?' on':''}" d="${d}" ${st}/><polygon class="ah" points="${ax},${ay} ${ax-ux*16-uy*8},${ay-uy*16+ux*8} ${ax-ux*16+uy*8},${ay-uy*16-ux*8}" ${st}/>`;
        h+=`<path class="hit" data-e="${g.id}" d="${d}"/>`;
        if(s.t){const w=lw(s.t)+24;l+=`<g class="lbg" data-e="${g.id}" transform="translate(${s.m[0]} ${s.m[1]})"><rect class="chip" x="${-w/2}" y="-17" width="${w}" height="34"/><text class="lb" y="7">${esc(s.t)}</text></g>`}}
      continue}
    const on=sel&&sel.t==='e'&&sel.id===g.id,c=`style="stroke:var(--c${g.c});color:var(--c${g.c})"`,
    cx=(a.x+b.x)/2-(b.y-a.y)*.08,cy=(a.y+b.y)/2+(b.x-a.x)*.08,d=`M${a.x} ${a.y}Q${cx} ${cy} ${b.x} ${b.y}`,mx=(a.x+b.x+2*cx)/4,my=(a.y+b.y+2*cy)/4;
    e+=`<path class="edge${on?' on':''}" d="${d}" ${c}/>`+(S.theme==='sketch'?`<path class="edge e2" d="M${a.x+3} ${a.y-2}Q${cx-2} ${cy+3} ${b.x-2} ${b.y+3}" ${c}/>`:'');
    h+=`<path class="hit" data-e="${g.id}" d="${d}"/>`;
    if(g.label){const w=lw(g.label)+24;l+=`<g class="lbg" data-e="${g.id}" transform="translate(${mx} ${my})"><rect class="chip" x="${-w/2}" y="-17" width="${w}" height="34"/><text class="lb" y="7">${esc(g.label)}</text></g>`}}
  for(const d of S.nodes){const on=sel&&sel.t==='n'&&sel.id===d.id;
    n+=`<g class="node${on?' on':''}${from===d.id?' from':''}" data-n="${d.id}" transform="translate(${d.x} ${d.y})"><g class="sh"><path class="ring" d="${shp(R+8)}"/>`+
    (d.img?`<image href="${d.img}" x="${-R}" y="${-R}" width="${2*R}" height="${2*R}" clip-path="url(#cp-sketch)" preserveAspectRatio="xMidYMid slice"/>`:`<path class="ph" d="${shp(R)}"/><text class="ini" y="12">${esc([...d.name][0]||'')}</text>`)+
    `<circle class="gloss" r="${R}"/><ellipse class="spec" cx="${-R*.3}" cy="${-R*.6}" rx="${R*.5}" ry="${R*.19}" transform="rotate(-26 ${-R*.3} ${-R*.6})"/><circle class="rim" r="${R}"/></g><text class="nm" y="${R+36}">${esc(d.name)}</text></g>`}
  if(!S.nodes.length)n+=`<text class="nm" x="${vb.x+vb.w/2}" y="${vb.y+vb.h/2}">위의 + 인물 버튼으로 시작하세요</text>`;
  $('#eg').innerHTML=e;$('#hg').innerHTML=h;$('#lg').innerHTML=l;$('#ng').innerHTML=n;
  document.querySelectorAll('.lbg').forEach(g=>{const w=g.querySelector('text').getBBox().width+26,r=g.querySelector('rect');r.setAttribute('x',-w/2);r.setAttribute('width',w)});
  $('#ttl').value!==S.title&&($('#ttl').value=S.title);
  document.querySelectorAll('#themes button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.theme));
  $('#conn').classList.toggle('on',mode==='conn');
}

/* 캔버스 조작 */
svg.addEventListener('pointerdown',ev=>{
  const nE=ev.target.closest('[data-n]'),eE=ev.target.closest('[data-e]'),p=pt(ev);
  if(nE){const id=+nE.dataset.n;
    if(mode==='conn'){
      if(from==null){from=id;hint('이어질 두 번째 인물을 누르세요',true)}
      else if(from!==id){const g={id:uid(),a:from,b:id,label:'',c:0};S.edges.push(g);endConn();sel={t:'e',id:g.id};save()}
      render();panel();return}
    sel={t:'n',id};const d=N(id);drag={k:'n',d,dx:p.x-d.x,dy:p.y-d.y};
  }else if(eE&&mode!=='conn'){sel={t:'e',id:+eE.dataset.e}}
  else{sel=null;drag={k:'p',cx:ev.clientX,cy:ev.clientY,vx:vb.x,vy:vb.y}}
  svg.setPointerCapture(ev.pointerId);render();panel();
});
svg.addEventListener('pointermove',ev=>{
  if(!drag)return;
  if(drag.k==='n'){const p=pt(ev);drag.d.x=Math.round(p.x-drag.dx);drag.d.y=Math.round(p.y-drag.dy)}
  else{const k=vb.w/svg.clientWidth;vb.x=drag.vx-(ev.clientX-drag.cx)*k;vb.y=drag.vy-(ev.clientY-drag.cy)*k}
  render();
});
const up=()=>{if(drag){drag=null;save()}};
svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
function zoom(f,p){p=p||{x:vb.x+vb.w/2,y:vb.y+vb.h/2};vb.x=p.x-(p.x-vb.x)*f;vb.y=p.y-(p.y-vb.y)*f;vb.w*=f;vb.h*=f;render()}
svg.addEventListener('wheel',ev=>{ev.preventDefault();zoom(ev.deltaY>0?1.1:.9,pt(ev))},{passive:false});
$('#zi').onclick=()=>zoom(.8);$('#zo').onclick=()=>zoom(1.25);
function endConn(){mode=null;from=null;$('#hint').hidden=true}

/* 사진 */
function readImg(f,cb){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
  const s=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=200;
  c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,200,200);cb(c.toDataURL('image/jpeg',.85))};im.src=r.result};r.readAsDataURL(f)}

/* 편집 패널 */
function panel(){
  if(!sel){P.hidden=true;return}
  P.hidden=false;const q=s=>P.querySelector(s);
  if(sel.t==='new'){
    P.innerHTML=`<h3>인물 추가</h3><label>이름 (필수)<input type="text" id="nm" maxlength="20" placeholder="이름을 입력하세요"></label><label>사진<input type="file" id="ph" accept="image/*"></label><button class="pri" id="ok" disabled>추가하기</button><button id="cx">닫기</button>`;
    let img='';q('#nm').focus();
    q('#nm').oninput=e=>q('#ok').disabled=!e.target.value.trim();
    q('#ph').onchange=e=>readImg(e.target.files[0],d=>img=d);
    q('#ok').onclick=()=>{const nm=q('#nm').value.trim();if(!nm)return;
      const d={id:uid(),name:nm,img,x:Math.round(vb.x+vb.w/2+(Math.random()-.5)*160),y:Math.round(vb.y+vb.h/2+(Math.random()-.5)*160)};
      S.nodes.push(d);sel={t:'n',id:d.id};save();render();panel()};
    q('#cx').onclick=()=>{sel=null;panel()};
  }else if(sel.t==='n'){
    const d=N(sel.id);if(!d){sel=null;P.hidden=true;return}
    P.innerHTML=`<h3>인물</h3><label>이름 (필수)<input type="text" id="nm" maxlength="20" value="${esc(d.name)}"></label><label>사진 ${d.img?'바꾸기':'넣기'}<input type="file" id="ph" accept="image/*"></label>${d.img?'<button id="rm">사진 지우기</button>':''}<button class="pri" id="lk">이 인물에서 관계 잇기</button><button id="dl">인물 삭제</button>`;
    const nm=q('#nm');
    nm.oninput=()=>{nm.classList.toggle('bad',!nm.value.trim());if(nm.value.trim()){d.name=nm.value.trim();render()}};
    nm.onblur=()=>{if(!nm.value.trim()){nm.value=d.name;nm.classList.remove('bad')}save()};
    q('#ph').onchange=e=>readImg(e.target.files[0],x=>{d.img=x;save();render();panel()});
    if(q('#rm'))q('#rm').onclick=()=>{d.img='';save();render();panel()};
    q('#lk').onclick=()=>{mode='conn';from=d.id;sel=null;hint('이어질 두 번째 인물을 누르세요',true);render();panel()};
    q('#dl').onclick=()=>{if(!confirm(d.name+' 님과 연결된 관계도 함께 지워져요. 삭제할까요?'))return;
      S.nodes=S.nodes.filter(x=>x.id!==d.id);S.edges=S.edges.filter(g=>g.a!==d.id&&g.b!==d.id);sel=null;save();render();panel()};
  }else{
    const g=S.edges.find(x=>x.id===sel.id);if(!g){sel=null;P.hidden=true;return}
    const duo=g.type==='duo',sw=(k,cur)=>`<div class="sw">${PRESETS.map((t,i)=>`<div><button data-${k}="${i}" style="--c:var(--c${i})" class="${cur===i?'on':''}" aria-label="${t}"></button><span>${t}</span></div>`).join('')}</div>`,A=esc(N(g.a).name),B=esc(N(g.b).name);
    P.innerHTML=`<h3>${A} ${duo?'⇄':'↔'} ${B}</h3><div class="seg2"><button data-ty="line" class="${duo?'':'on'}">기본 선</button><button data-ty="duo" class="${duo?'on':''}">주고받는 선</button></div>`+
    (duo?`<label>${A} → ${B}<input type="text" id="lb" maxlength="16" placeholder="${A}가 보는 ${B}" value="${esc(g.label)}"></label><div>선 색상${sw('c',g.c)}</div><label>${B} → ${A}<input type="text" id="lb2" maxlength="16" placeholder="${B}가 보는 ${A}" value="${esc(g.label2||'')}"></label><div>선 색상${sw('k',g.c2==null?g.c:g.c2)}</div>`
    :`<label>관계 (선 위에 표시)<input type="text" id="lb" maxlength="16" placeholder="예: 소꿉친구" value="${esc(g.label)}"></label><div>선 색상${sw('c',g.c)}</div>`)+`<button id="dl">관계 삭제</button>`;
    P.querySelectorAll('[data-ty]').forEach(b=>b.onclick=()=>{g.type=b.dataset.ty;if(g.type==='duo'&&g.c2==null)g.c2=g.c;save();render();panel()});
    q('#lb').oninput=e=>{g.label=e.target.value;save();render()};
    if(q('#lb2'))q('#lb2').oninput=e=>{g.label2=e.target.value;save();render()};
    P.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{g.c=+b.dataset.c;save();render();panel()});
    P.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{g.c2=+b.dataset.k;save();render();panel()});
    q('#dl').onclick=()=>{S.edges=S.edges.filter(x=>x.id!==g.id);sel=null;save();render();panel()};
  }
}

/* 상단 버튼 */
THEMES.forEach(([k,t])=>{const b=document.createElement('button');b.title=t;b.setAttribute('aria-label',t);b.dataset.t=k;b.onclick=()=>{S.theme=k;save();render()};$('#themes').append(b)});
$('#ttl').oninput=e=>{S.title=e.target.value;save()};
$('#fnt').onchange=e=>{S.font=e.target.value;save();render()};
document.fonts&&document.fonts.ready.then(render);
$('#add').onclick=()=>{endConn();sel={t:'new'};render();panel()};
$('#conn').onclick=()=>{if(mode){endConn()}else{if(S.nodes.length<2){hint('인물을 2명 이상 추가해 주세요');return}mode='conn';sel=null;hint('이어줄 첫 번째 인물을 누르세요',true)}render();panel()};
$('#exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download=(S.title||'relationship')+'.json';a.click();URL.revokeObjectURL(a.href)};
async function savePng(){
  if(!S.nodes.length){hint('인물을 먼저 추가해 주세요');return}
  hint('이미지를 만드는 중…',true);
  try{
  const t=S.theme,cs=getComputedStyle(document.body),v=n=>cs.getPropertyValue(n).trim(),fam=cs.fontFamily,fs=parseFloat(v('--fs'))||19,font=s=>`${s}px ${fam}`;
  await document.fonts.ready;
  try{await document.fonts.load(font(fs),S.nodes.map(n=>n.name).concat(S.edges.map(e=>e.label),S.title).join(''))}catch(e){}
  const imgs={};await Promise.all(S.nodes.filter(n=>n.img).map(n=>new Promise(r=>{const i=new Image();i.onload=()=>{imgs[n.id]=i;r()};i.onerror=r;i.src=n.img})));
  const xs=S.nodes.map(n=>n.x),ys=S.nodes.map(n=>n.y),P=120,x0=Math.min(...xs)-P,y0=Math.min(...ys)-P-30,W=Math.max(...xs)+P-x0,H=Math.max(...ys)+P+30-y0;
  const sc=Math.min(2,4096/Math.max(W,H)),c=document.createElement('canvas');c.width=Math.round(W*sc);c.height=Math.round(H*sc);
  const g=c.getContext('2d');g.scale(sc,sc);g.translate(-x0,-y0);
  const lin=st=>{const q=g.createLinearGradient(x0,y0,x0,y0+H);st.forEach(s=>q.addColorStop(s[0],s[1]));return q},
  rad=(cx,cy,r,st)=>{const q=g.createRadialGradient(cx,cy,0,cx,cy,r);st.forEach(s=>q.addColorStop(s[0],s[1]));return q},
  fill=f=>{g.fillStyle=f;g.fillRect(x0,y0,W,H)};
  if(t==='sketch'){fill('#fbf6e9');for(let y=y0+16;y<y0+H;y+=32){g.beginPath();g.arc(x0+22,y,5,0,7);g.fillStyle='#2b2b2b';g.fill();g.lineWidth=2;g.strokeStyle='#cfc7b5';g.stroke()}}
  else if(t==='summer'){fill(lin([[0,'#a9e4ff'],[.45,'#5db2ff'],[1,'#2f6fe0']]));fill(rad(x0+W*.85,y0,W*.6,[[0,'rgba(255,255,255,.55)'],[1,'rgba(255,255,255,0)']]))}
  else if(t==='themis'){fill(lin([[0,'#16205e'],[1,'#080c28']]));fill(rad(x0+W/2,y0-H*.1,Math.max(W,H),[[0,'#31479f'],[.6,'rgba(22,32,94,0)']]))}
  else{fill('#07040d');fill(rad(x0+W*.9,y0,W*.6,[[0,'rgba(168,85,247,.38)'],[1,'rgba(168,85,247,0)']]));fill(rad(x0,y0+H,W*.5,[[0,'rgba(236,72,153,.25)'],[1,'rgba(236,72,153,0)']]))}
  const N=id=>S.nodes.find(n=>n.id===id),col=i=>v('--c'+i)||'#888',ew=parseFloat(v('--ew'))||3,chips=[];
  g.lineCap='round';
  for(const e of S.edges){const a=N(e.a),b=N(e.b);if(!a||!b)continue;
    if(e.type==='duo'){for(const s of duoSegs(e,a,b)){const [x0,y0,,,x1,y1]=s.q,[ax,ay,ux,uy]=s.arr;g.strokeStyle=g.fillStyle=col(s.c);g.lineWidth=ew;g.beginPath();g.moveTo(x0,y0);g.lineTo(x1-ux*12,y1-uy*12);if(t==='themis'){g.shadowColor=col(s.c);g.shadowBlur=8}g.stroke();g.shadowBlur=0;g.beginPath();g.moveTo(ax,ay);g.lineTo(ax-ux*16-uy*8,ay-uy*16+ux*8);g.lineTo(ax-ux*16+uy*8,ay-uy*16-ux*8);g.closePath();g.fill();if(s.t)chips.push([s.t,s.m[0],s.m[1]])}continue}
    const cx=(a.x+b.x)/2-(b.y-a.y)*.08,cy=(a.y+b.y)/2+(b.x-a.x)*.08;
    g.strokeStyle=col(e.c);g.lineWidth=ew;g.beginPath();g.moveTo(a.x,a.y);g.quadraticCurveTo(cx,cy,b.x,b.y);
    if(t==='themis'){g.shadowColor=col(e.c);g.shadowBlur=8}g.stroke();g.shadowBlur=0;
    if(t==='sketch'){g.globalAlpha=.55;g.lineWidth=2;g.beginPath();g.moveTo(a.x+3,a.y-2);g.quadraticCurveTo(cx-2,cy+3,b.x-2,b.y+3);g.stroke();g.globalAlpha=1}
    if(e.label)chips.push([e.label,(a.x+b.x+2*cx)/4,(a.y+b.y+2*cy)/4])}
  g.textAlign='center';g.textBaseline='alphabetic';g.font=font(fs);
  for(const [txt,x,y] of chips){const w=g.measureText(txt).width+26,cr=Math.min(parseFloat(v('--chipr'))||12,17),cw=parseFloat(v('--chipw'))||0;
    let f=v('--chipf');if(f.startsWith('url')){f=g.createLinearGradient(x-w/2,y,x+w/2,y);f.addColorStop(0,'#a855f7');f.addColorStop(1,'#ec4899')}
    g.beginPath();g.roundRect(x-w/2,y-17,w,34,cr);g.fillStyle=f;g.fill();
    if(cw){g.lineWidth=cw;g.strokeStyle=v('--chips');g.stroke()}
    g.fillStyle=v('--chipt');g.fillText(txt,x,y+7)}
  for(const d of S.nodes){
    g.save();g.translate(d.x,d.y);
    g.shadowColor=t==='themis'?'rgba(120,150,255,.5)':'rgba(0,0,0,.28)';g.shadowBlur=t==='themis'?16:14;g.shadowOffsetY=t==='themis'?0:8;
    g.beginPath();g.arc(0,0,R+8,0,7);g.fillStyle=v('--gf')||'rgba(255,255,255,.3)';g.fill();g.shadowColor='transparent';
    g.lineWidth=3;g.strokeStyle=t==='sketch'?'#4a4a4a':'rgba(255,255,255,.7)';g.stroke();
    g.save();g.beginPath();g.arc(0,0,R,0,7);g.clip();
    const im=imgs[d.id];
    if(im){const s=Math.min(im.width,im.height);g.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,-R,-R,2*R,2*R)}
    else{g.fillStyle=v('--ph')||'#ccc';g.fillRect(-R,-R,2*R,2*R);g.fillStyle=v('--ink');g.font=font(36);g.textBaseline='middle';g.fillText([...d.name][0]||'',0,2);g.textBaseline='alphabetic'}
    const gl=g.createLinearGradient(0,-R,0,R);gl.addColorStop(0,`rgba(255,255,255,${t==='sketch'?.15:.28})`);gl.addColorStop(.55,'rgba(255,255,255,0)');g.fillStyle=gl;g.fillRect(-R,-R,2*R,2*R);
    g.restore();
    g.beginPath();g.arc(0,0,R,0,7);g.lineWidth=1.5;g.strokeStyle='rgba(255,255,255,.5)';g.stroke();
    g.beginPath();g.ellipse(-R*.3,-R*.6,R*.5,R*.19,-.45,0,7);const sp=g.createLinearGradient(0,-R*.8,0,-R*.4);sp.addColorStop(0,'rgba(255,255,255,.65)');sp.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=sp;g.fill();
    g.restore();
    g.font=font(fs+1);g.lineJoin='round';g.lineWidth=5;g.strokeStyle=v('--halo');g.strokeText(d.name,d.x,d.y+R+36);g.fillStyle=v('--ink');g.fillText(d.name,d.x,d.y+R+36)}
  g.textAlign='left';g.fillStyle=v('--ink');g.font=font(fs+7);if(S.title)g.fillText(S.title,x0+34,y0+44);
  g.textAlign='right';g.globalAlpha=.6;g.font="700 12px Orbitron,sans-serif";try{g.letterSpacing='4px'}catch(e){}g.fillText('ETTIMAKER',x0+W-24,y0+H-22);g.globalAlpha=1;
  c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(S.title||'relationship')+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);hint('PNG로 저장했어요')},'image/png');
  }catch(e){hint('이미지 저장에 실패했어요')}
}
$('#png').onclick=savePng;
$('#imp').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.nodes)||!Array.isArray(d.edges))throw 0;
  S={title:d.title||'',theme:THEMES.some(t=>t[0]===d.theme)?d.theme:'sketch',nodes:d.nodes,edges:d.edges};sel=null;save();render();panel()}catch(x){hint('관계도 JSON 파일이 아니에요')}};r.readAsText(f);e.target.value=''};
$('#new').onclick=()=>{if(!confirm('현재 관계도를 지우고 새로 시작할까요? (먼저 저장 버튼으로 내려받아 두세요)'))return;S={title:'',theme:S.theme,nodes:[],edges:[]};sel=null;endConn();save();render();panel()};
addEventListener('resize',()=>{fit();render()});
document.querySelectorAll('#more button').forEach(b=>b.addEventListener('click',()=>$('#more').open=false));
if(innerWidth<700){vb.w=520;fit();if(S.nodes.length){const k=S.nodes.length;vb.x=S.nodes.reduce((s,n)=>s+n.x,0)/k-vb.w/2;vb.y=S.nodes.reduce((s,n)=>s+n.y,0)/k-vb.h/2}}
fit();render();
</script>
